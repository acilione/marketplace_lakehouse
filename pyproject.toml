[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "marketplace-lakehouse"
version = "0.1.0"
description = "Production-oriented Spark and Iceberg marketplace lakehouse"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = { text = "Apache-2.0" }
authors = [{ name = "Data Platform Engineering" }]
dependencies = [
  "confluent-kafka==2.15.0",
  "fastavro==1.12.2",
  "prometheus-client==0.26.0",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "PyYAML==6.0.3",
  "structlog==26.1.0",
  "tenacity==9.1.4",
]

[project.optional-dependencies]
# Spark 4.2 is newer, but Iceberg 1.11 has no Spark 4.2 runtime. 4.1.3 is the
# latest Spark release in Iceberg's maintained Spark 4.1 compatibility line.
spark = ["pyspark==4.1.3"]
dev = [
  "bandit==1.9.4",
  "cyclonedx-bom==7.3.1",
  "hypothesis==6.167.1",
  "jsonschema==4.26.0",
  "mypy==2.3.1",
  "pip-audit==2.10.1",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "pytest-xdist==3.8.0",
  "ruff==0.16.5",
  "types-PyYAML==6.0.12.20260815",
]

[project.scripts]
marketplace-generate = "marketplace_data.generator:main"
marketplace-simulate = "marketplace_data.simulator:main"

[tool.hatch.build.targets.wheel]
packages = ["src/marketplace_data"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = [
  "integration: requires Docker services or an Iceberg catalog",
  "slow: takes more than a few seconds",
]

[tool.coverage.run]
branch = true
source = ["marketplace_data"]
omit = [
  "*/jobs/*",
  "*/iceberg.py",
  "*/logging.py",
  "*/observability.py",
  "*/spark.py",
  "*/tables.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "apps", "tests", "orchestration"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S", "RUF", "C4", "DTZ", "T20"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106"]
"orchestration/**/*.py" = ["S603", "S607"]
"src/marketplace_data/generator.py" = ["T201"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_configs = true
exclude = ["orchestration/", "apps/"]

[[tool.mypy.overrides]]
module = ["pyspark.*", "confluent_kafka.*", "fastavro.*", "prometheus_client.*"]
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]
