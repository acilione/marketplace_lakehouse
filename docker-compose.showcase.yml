# Isolated state and ports for the complete, executable showcase.
services:
  minio:
    ports: !reset []
  iceberg-rest:
    ports: !reset []
  kafka:
    ports: !reset []
  schema-registry:
    ports: !reset []
  spark-master:
    ports: !reset []
  spark-worker:
    ports: !reset []
  trino:
    ports: !override ["127.0.0.1:${ANALYTICS_TRINO_PORT:-24186}:8080"]
  architecture-site:
    ports: !override ["127.0.0.1:${ANALYTICS_WEB_PORT:-24173}:8080"]
  control-api:
    environment:
      HIDE_SERVICE_LINKS: "true"
      DASHBOARD_PUBLIC_SHOWCASE: ${DASHBOARD_PUBLIC_SHOWCASE:-true}
  service-controller:
    environment:
      COMPOSE_PROJECT_NAME: ${ANALYTICS_PROJECT:-marketplace-lakehouse-showcase}
