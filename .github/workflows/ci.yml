name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  analytics-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Prepare isolated configuration
        run: cp .env.example .env
      - name: Exercise Kafka to published analytics
        run: make analytics-demo ANALYTICS_ORDERS=100 ANALYTICS_CUSTOMERS=20
      - name: Verify corrections, quarantine, partial failure and replay equivalence
        run: make analytics-verify
      - name: Verify coordinated output maintenance
        run: |
          make analytics-retention-plan
          make analytics-compact
          make analytics-reference-check
      - name: Verify anonymous read API and protected administration
        run: |
          curl --fail --retry 5 --retry-delay 2 'http://localhost:24173/api/analytics?view=cohorts&currency=EUR' | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["status"] == "ready"; assert d["cohorts"]'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:24173/api/services)" = 401
      - name: Collect service diagnostics
        if: always()
        run: |
          mkdir -p artifacts/ci
          docker compose -p marketplace-lakehouse-showcase -f docker-compose.yml -f docker-compose.showcase.yml logs --no-color > artifacts/ci/services.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: analytics-integration-evidence
          path: artifacts/ci/
      - name: Stop ephemeral services
        if: always()
        run: docker compose -p marketplace-lakehouse-showcase -f docker-compose.yml -f docker-compose.showcase.yml down

  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Validate workflow syntax and shell scripts
        run: docker run --rm -v "${GITHUB_WORKSPACE}:/repo:ro" -w /repo rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/runtime.lock
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Install exact development set
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip==26.2.1
          .venv/bin/python -m pip install -c requirements/runtime.lock -e '.[spark,dev]'
      - name: Formatting and lint
        run: make lint
      - name: Strict types
        run: make type
      - name: Unit and contract tests
        run: make python-test
      - name: Architecture site lint, tests, and production build
        run: make architecture-check
      - name: Source security scan
        run: .venv/bin/bandit -q -r src apps orchestration
      - name: Dependency audit
        run: .venv/bin/pip-audit && make architecture-audit
      - name: Compose rendering
        run: make compose-validate
      - name: Repository hygiene
        run: ./scripts/verify-repository.sh
      - name: SBOM
        run: .venv/bin/cyclonedx-py environment .venv/bin/python --output-format JSON --output-file sbom-python.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-evidence
          path: |
            coverage.xml
            sbom-python.json

  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Build immutable candidate
        run: docker build --pull --tag "marketplace-lakehouse:${GITHUB_SHA}" --file docker/spark/Dockerfile .
      - name: Inspect effective user
        run: test "$(docker image inspect "marketplace-lakehouse:${GITHUB_SHA}" --format '{{.Config.User}}')" = "185"
      - name: Build architecture site image
        run: docker build --tag "marketplace-lakehouse-architecture:${GITHUB_SHA}" architecture-site
      - name: Inspect architecture site effective user
        run: test "$(docker image inspect "marketplace-lakehouse-architecture:${GITHUB_SHA}" --format '{{.Config.User}}')" = "nginx"
      - name: Build local control API image
        run: docker build --tag "marketplace-lakehouse-control-api:${GITHUB_SHA}" --file architecture-site/Dockerfile.control architecture-site
      - name: Inspect control API effective user
        run: test "$(docker image inspect "marketplace-lakehouse-control-api:${GITHUB_SHA}" --format '{{.Config.User}}')" = "node"
      - name: Build official object-store sources
        run: docker compose build minio minio-init
      - name: Verify object-store binaries
        run: |
          docker compose run --rm --no-deps minio --version
          docker compose run --rm --no-deps --entrypoint mc minio-init --version
      - name: Verify object-store initialization and S3 operations
        run: bash scripts/verify-object-store.sh
