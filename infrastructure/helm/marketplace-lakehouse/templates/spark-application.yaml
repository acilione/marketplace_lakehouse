{{- if .Values.streaming.enabled }}
apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: bronze-event-ingest
  labels:
    app.kubernetes.io/name: {{ include "marketplace.name" . }}
    marketplace.io/pipeline: bronze-event-ingest
spec:
  type: Python
  mode: cluster
  pythonVersion: "3"
  image: {{ include "marketplace.image" . }}
  imagePullPolicy: {{ .Values.image.pullPolicy }}
  mainApplicationFile: local:///opt/marketplace/apps/bronze_ingest/main.py
  arguments: ["--config", "/etc/marketplace/production.yaml"]
  sparkVersion: 4.1.3
  restartPolicy:
    type: OnFailure
    onFailureRetries: 5
    onFailureRetryInterval: 30
    onSubmissionFailureRetries: 3
    onSubmissionFailureRetryInterval: 30
  timeToLiveSeconds: 86400
  volumes:
    - name: configuration
      configMap:
        name: marketplace-lakehouse-config
  sparkConf:
    spark.sql.session.timeZone: UTC
    spark.sql.adaptive.enabled: "true"
    spark.sql.adaptive.skewJoin.enabled: "true"
    spark.eventLog.enabled: "true"
    spark.kubernetes.executor.deleteOnTermination: "true"
    spark.network.timeout: 300s
    spark.executor.heartbeatInterval: 30s
  driver:
    cores: {{ .Values.streaming.driver.cores }}
    memory: {{ .Values.streaming.driver.memory }}
    serviceAccount: {{ .Values.serviceAccount.name }}
    labels:
      marketplace.io/component: driver
    securityContext:
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: ["ALL"]
    volumeMounts:
      - name: configuration
        mountPath: /etc/marketplace
        readOnly: true
  executor:
    instances: {{ .Values.streaming.executor.instances }}
    cores: {{ .Values.streaming.executor.cores }}
    memory: {{ .Values.streaming.executor.memory }}
    labels:
      marketplace.io/component: executor
    securityContext:
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: ["ALL"]
    volumeMounts:
      - name: configuration
        mountPath: /etc/marketplace
        readOnly: true
{{- end }}

