apiVersion: v1
kind: ResourceQuota
metadata:
  name: marketplace-lakehouse
spec:
  hard:
    requests.cpu: "64"
    requests.memory: 192Gi
    limits.cpu: "96"
    limits.memory: 256Gi
    pods: "100"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: marketplace-lakehouse
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 250m
        memory: 512Mi
      default:
        cpu: "2"
        memory: 8Gi

